<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIP · Seconser — Mapa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    /* Garante que o app ocupa a tela toda sem scroll */
    html, body { height: 100%; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #map { flex: 1; min-height: 0; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Carregando dados da planilha…</p>
  <p id="error-msg"></p>
</div>

<div id="app" style="display:none">

  <div class="topbar">
    <div>
      <div class="topbar-title">DIP · Seconser Niterói</div>
      <div class="topbar-sub" id="sub-periodo">carregando…</div>
    </div>
    <nav class="topbar-nav">
      <a class="nav-link" href="../index.html">Visão Geral</a>
      <a class="nav-link nav-active" href="mapa.html">Mapa</a>
      <a class="nav-link" href="qualidade.html">Qualidade</a>
      <a class="nav-link" href="tendencia.html">Tendência</a>
    </nav>
    <div class="topbar-right">
      <span class="last-update" id="last-update"></span>
      <button class="refresh-btn" onclick="loadData()">↺ Atualizar</button>
    </div>
  </div>

  <div class="map-legend">
    <span><span class="map-dot" style="background:#639922"></span>OK</span>
    <span><span class="map-dot" style="background:#BA7517"></span>Em Atendimento</span>
    <span><span class="map-dot" style="background:#E24B4A"></span>Em Atraso</span>
    <span style="margin-left:auto;font-size:11px;color:var(--text3)" id="map-count"></span>
  </div>

  <div id="map"></div>

</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/data.js"></script>
<script>
  let map, markersLayer;

  const SIT_COLORS = {
    'OK':             '#639922',
    'Em Atendimento': '#BA7517',
    'Em Atraso':      '#E24B4A',
  };

  function initMap() {
    if (map) return;
    map = L.map('map', { preferCanvas: true }).setView([-22.903, -43.172], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 18,
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }

  function plotPoints(rows) {
    markersLayer.clearLayers();
    let plotted = 0;
    rows.forEach(r => {
      const lat = parseFloat((r['Latitude']  || '').replace(',', '.'));
      const lng = parseFloat((r['Longitude'] || '').replace(',', '.'));
      if (isNaN(lat) || isNaN(lng)) return;
      const sit   = (r['Situação'] || '').trim();
      const color = SIT_COLORS[sit] || '#888780';
      L.circleMarker([lat, lng], {
        radius: 5, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.85,
      }).bindPopup(`
        <b>${r['Categoria'] || '—'}</b><br>
        ${r['Bairro'] || '—'} · ${r['Região'] || '—'}<br>
        Situação: <b style="color:${color}">${sit || '—'}</b><br>
        Saída: ${r['Data Saída'] || '—'} · Retorno: ${r['Data Retorno'] || '—'}<br>
        Dias execução: ${r['Dias Execução'] || '—'}
      `).addTo(markersLayer);
      plotted++;
    });
    document.getElementById('map-count').textContent = fmt(plotted) + ' pontos no mapa';
    // Força o Leaflet a recalcular o tamanho após o app ficar visível
    setTimeout(() => map.invalidateSize(), 100);
  }

  function render(rows) {
    const range = dateRange(rows);
    if (range) {
      document.getElementById('sub-periodo').textContent =
        mesLabel(range.min) + ' – ' + mesLabel(range.max) + ' · ' + fmt(rows.length) + ' registros';
    }
    document.getElementById('last-update').textContent =
      'atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    initMap();
    plotPoints(rows);
  }

  function onDataLoaded() {
    render(allRows);
  }

  function populateFilters() {}

  loadData();
</script>
</body>
</html>
