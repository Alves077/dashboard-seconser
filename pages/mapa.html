<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIP · Seconser — Mapa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #app {
      display: block;
    }

    /* ── Layout principal: mapa + painel ── */
    /* topbar ~57px + map-legend ~37px = ~94px */
    .map-body {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: calc(100vh - 94px);
      overflow: hidden;
      gap: 0;
    }

    /* ── Container do mapa ── */
    .map-wrap {
      position: relative;
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* ── Painel lateral ── */
    .map-panel {
      background: var(--surface);
      border-left: 0.5px solid var(--border2);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 1rem 1rem 2rem;
      gap: 1rem;
    }

    .map-panel-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-panel-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-bottom: 6px;
      border-bottom: 0.5px solid var(--border);
    }

    /* ── KPIs do painel ── */
    .map-kpis {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .map-kpi {
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 8px 10px;
      text-align: center;
    }

    .map-kpi-n {
      font-size: 20px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .map-kpi-l {
      font-size: 10px;
      color: var(--text2);
      margin-top: 3px;
    }

    /* ── Legenda/filtro ── */
    .map-legend {
      display: flex;
      gap: 6px;
      padding: 8px var(--page-px);
      background: var(--surface);
      border-bottom: 0.5px solid var(--border2);
      font-size: 12px;
      color: var(--text2);
      align-items: center;
      flex-wrap: wrap;
    }

    .map-legend-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface2);
      color: var(--text2);
      transition: all 0.15s;
      user-select: none;
    }

    .map-legend-btn.active {
      border-color: currentColor;
      color: var(--text);
      background: var(--surface);
    }

    .map-legend-btn.active .map-dot {
      opacity: 1;
    }

    .map-legend-btn:not(.active) .map-dot {
      opacity: 0.35;
    }

    .map-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .map-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text3);
    }

    /* ── Barras do painel ── */
    .panel-bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .panel-bar-label {
      font-size: 11px;
      color: var(--text2);
      width: 100px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .panel-bar-track {
      flex: 1;
      background: var(--surface2);
      border-radius: 2px;
      height: 6px;
      overflow: hidden;
    }

    .panel-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .panel-bar-val {
      font-size: 11px;
      color: var(--text2);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Mobile: esconde mapa, mostra só painel ── */
    @media (max-width: 720px) {

      html,
      body {
        overflow: auto;
      }

      .map-wrap {
        display: none;
      }

      .map-body {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }

      .map-panel {
        border-left: none;
        overflow-y: visible;
        padding-bottom: 3rem;
      }

      /* Mantém a barra visível para o select de região funcionar */
      .map-legend {
        display: flex;
      }

      /* Oculta botões de situação e contagem — sem mapa não fazem sentido */
      .map-legend-btn {
        display: none;
      }

      .map-count {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando dados da planilha…</p>
    <p id="error-msg"></p>
  </div>

  <div id="app" style="display:none">

    <div class="topbar">
      <div class="topbar-brand">
        <img src="../img/logo-seconser.png" alt="Seconser Niterói" class="topbar-logo">
        <div>
          <div class="topbar-title">DIP · Seconser Niterói</div>
          <div class="topbar-sub" id="sub-periodo">carregando…</div>
        </div>
      </div>
      <nav class="topbar-nav">
        <a class="nav-link" href="../index.html">Visão Geral</a>
        <a class="nav-link nav-active" href="mapa.html">Mapa</a>
        <a class="nav-link" href="qualidade.html">Qualidade</a>
        <a class="nav-link" href="tendencia.html">Tendência</a>
      </nav>
      <div class="topbar-right">
        <span class="last-update" id="last-update"></span>
        <button class="refresh-btn" onclick="loadData()">↺ Atualizar</button>
      </div>
    </div>

    <!-- Legenda / filtro por situação -->
    <div class="map-legend">
      <button class="map-legend-btn active" data-sit="OK" onclick="toggleSit('OK', this)">
        <span class="map-dot" style="background:#639922"></span>OK
      </button>
      <button class="map-legend-btn active" data-sit="Em Atendimento" onclick="toggleSit('Em Atendimento', this)">
        <span class="map-dot" style="background:#BA7517"></span>No Prazo
      </button>
      <button class="map-legend-btn active" data-sit="Em Atraso" onclick="toggleSit('Em Atraso', this)">
        <span class="map-dot" style="background:#E24B4A"></span>Em Atraso
      </button>
      <div class="fg" style="margin-left:12px">
        <label style="font-size:11px;color:var(--text2)">Região</label>
        <select id="fMapRegiao" style="font-size:11px;padding:3px 8px;border-radius:6px;border:0.5px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer" onchange="applyMapFilter()">
          <option value="">Todas</option>
        </select>
      </div>
      <span class="map-count" id="map-count"></span>
    </div>

    <!-- Mapa + painel lateral -->
    <div class="map-body">
      <div class="map-wrap">
        <div id="map"></div>
      </div>

      <div class="map-panel">

        <!-- KPIs de abertos -->
        <div class="map-panel-section">
          <div class="map-panel-title">Situação atual</div>
          <div class="map-kpis">
            <div class="map-kpi">
              <div class="map-kpi-n" id="pOk" style="color:var(--green)">—</div>
              <div class="map-kpi-l">Concluídos</div>
            </div>
            <div class="map-kpi">
              <div class="map-kpi-n" id="pAberto" style="color:var(--amber)">—</div>
              <div class="map-kpi-l">Em aberto</div>
            </div>
            <div class="map-kpi">
              <div class="map-kpi-n" id="pAr" style="color:var(--red)">—</div>
              <div class="map-kpi-l">Em atraso</div>
            </div>
          </div>
        </div>

        <!-- Abertos por região -->
        <div class="map-panel-section">
          <div class="map-panel-title">Abertos por região</div>
          <div id="pRegList"></div>
        </div>

        <!-- Top bairros com abertos -->
        <div class="map-panel-section">
          <div class="map-panel-title">Top bairros · em aberto</div>
          <div id="pBairroList"></div>
        </div>

        <!-- Mais antigos em atraso -->
        <div class="map-panel-section">
          <div class="map-panel-title">Mais antigos em atraso</div>
          <div id="pAtrasadosList"></div>
        </div>

        <!-- Abertos por categoria -->
        <div class="map-panel-section">
          <div class="map-panel-title">Abertos por categoria</div>
          <div id="pCatList"></div>
        </div>

      </div>
    </div>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/data.js"></script>
  <script>
    let map, markersLayer;
    let visibleSits = new Set(['OK', 'Em Atendimento', 'Em Atraso']);
    let currentRows = [];

    const SIT_COLORS = {
      'OK': '#639922',
      'Em Atendimento': '#BA7517',
      'Em Atraso': '#E24B4A',
    };

    function toggleSit(sit, btn) {
      if (visibleSits.has(sit)) {
        if (visibleSits.size === 1) return; // mínimo 1 ativo
        visibleSits.delete(sit);
        btn.classList.remove('active');
      } else {
        visibleSits.add(sit);
        btn.classList.add('active');
      }
      plotPoints(currentRows);
    }

    function initMap() {
      if (map) return;
      map = L.map('map', {
        preferCanvas: true,
        minZoom: 11,
      }).setView([-22.910, -43.085], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18,
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    function plotPoints(rows) {
      markersLayer.clearLayers();
      let plotted = 0;
      const sorted = [
        ...rows.filter(r => (r['Situação'] || '').trim() === 'OK'),
        ...rows.filter(r => (r['Situação'] || '').trim() === 'Em Atendimento'),
        ...rows.filter(r => (r['Situação'] || '').trim() === 'Em Atraso'),
      ];
      sorted.forEach(r => {
        const lat = parseFloat((r['Latitude'] || '').replace(',', '.'));
        const lng = parseFloat((r['Longitude'] || '').replace(',', '.'));
        if (isNaN(lat) || isNaN(lng)) return;
        const sit = (r['Situação'] || '').trim();
        if (!visibleSits.has(sit)) return;
        const color = SIT_COLORS[sit] || '#888780';
        let diasAberto = '';
        if (sit === 'Em Atendimento' || sit === 'Em Atraso') {
          const saida = parseDate(r['Data Saída']);
          if (saida && !isNaN(saida)) {
            const diff = Math.floor((new Date() - saida) / 86400000);
            const sufixo = sit === 'Em Atendimento' ? 'no prazo' : 'em atraso';
            diasAberto = `<br><b style="color:${color}">${diff} dia${diff !== 1 ? 's' : ''} · ${sufixo}</b>`;
          }
        }

        const fmtDate = (val) => {
          if (!val) return '—';
          // Se já está em dd/mm/aaaa, retorna direto
          if (/^\d{2}\/\d{2}\/\d{4}$/.test(val.trim())) return val.trim();
          const d = parseDate(val);
          if (!d || isNaN(d)) return val;
          return d.getDate().toString().padStart(2, '0') + '/' +
            (d.getMonth() + 1).toString().padStart(2, '0') + '/' +
            d.getFullYear();
        };

        L.circleMarker([lat, lng], {
          radius: 5, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.85,
        }).bindPopup(`
        <b>ID ${r['ID Colab'] || '—'}</b><br>
        <span style="color:#555">${r['Categoria'] || '—'}</span><br>
        ${r['Bairro'] || '—'} · ${r['Região'] || '—'}<br>
        Situação: <b style="color:${color}">${sit || '—'}</b>${diasAberto}<br>
        Saída: ${fmtDate(r['Data Saída'])} · Retorno: ${fmtDate(r['Data Retorno'])}<br>
        Dias para execução: ${r['Dias Execução'] || '—'}
      `).addTo(markersLayer);
        plotted++;
      });
      document.getElementById('map-count').textContent = fmt(plotted) + ' pontos visíveis';
      setTimeout(() => map.invalidateSize(), 100);
    }

    function renderPanel(rows) {
      const ok = rows.filter(r => (r['Situação'] || '').trim() === 'OK').length;
      const at = rows.filter(r => (r['Situação'] || '').trim() === 'Em Atendimento').length;
      const ar = rows.filter(r => (r['Situação'] || '').trim() === 'Em Atraso').length;

      document.getElementById('pOk').textContent = fmt(ok);
      document.getElementById('pAberto').textContent = fmt(at + ar);
      document.getElementById('pAr').textContent = fmt(ar);

      const abertos = rows.filter(r => {
        const s = (r['Situação'] || '').trim();
        return s === 'Em Atendimento' || s === 'Em Atraso';
      });

      // Abertos por região
      const regMap = {};
      abertos.forEach(r => {
        const reg = (r['Região'] || '').trim();
        if (!reg) return;
        if (!regMap[reg]) regMap[reg] = { at: 0, ar: 0 };
        if ((r['Situação'] || '').trim() === 'Em Atraso') regMap[reg].ar++;
        else regMap[reg].at++;
      });
      const regEntries = Object.entries(regMap)
        .map(([k, v]) => [k, v.at + v.ar, v])
        .sort((a, b) => b[1] - a[1]);
      const maxReg = regEntries.length ? regEntries[0][1] : 1;

      document.getElementById('pRegList').innerHTML = regEntries.map(([lbl, n, v]) => `
      <div class="panel-bar-row" style="margin-bottom:8px">
        <span class="panel-bar-label" title="${lbl}">${lbl}</span>
        <div class="panel-bar-track">
          <div class="panel-bar-fill" style="width:${Math.round(n / maxReg * 100)}%;background:var(--amber)"></div>
        </div>
        <span class="panel-bar-val">${n}</span>
        <span style="font-size:10px;color:var(--red);width:48px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums">${v.ar > 0 ? v.ar + ' atr.' : ''}</span>
      </div>`).join('');

      // Top bairros abertos
      const bairroMap = {};
      abertos.forEach(r => {
        const b = (r['Bairro'] || '').trim();
        if (b) bairroMap[b] = (bairroMap[b] || 0) + 1;
      });
      const bairroEntries = Object.entries(bairroMap).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const maxB = bairroEntries.length ? bairroEntries[0][1] : 1;
      document.getElementById('pBairroList').innerHTML = bairroEntries.map(([lbl, n]) => `
      <div class="panel-bar-row">
        <span class="panel-bar-label" title="${lbl}">${lbl}</span>
        <div class="panel-bar-track">
          <div class="panel-bar-fill" style="width:${Math.round(n / maxB * 100)}%;background:var(--red)"></div>
        </div>
        <span class="panel-bar-val">${n}</span>
      </div>`).join('');

      // Top 5 mais antigos em atraso
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const atrasados = rows
        .filter(r => (r['Situação'] || '').trim() === 'Em Atraso')
        .map(r => {
          const saida = parseDate(r['Data Saída']);
          const dias = saida && !isNaN(saida) ? Math.floor((hoje - saida) / 86400000) : 0;
          return { ...r, _dias: dias };
        })
        .sort((a, b) => b._dias - a._dias)
        .slice(0, 5);

      document.getElementById('pAtrasadosList').innerHTML = atrasados.length
        ? atrasados.map(r => `
        <div style="padding:7px 0;border-bottom:0.5px solid var(--border);font-size:11px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="color:var(--text);font-weight:600">${r['Categoria'] || '—'}</span>
            <span style="color:var(--red);font-weight:700">${r._dias}d</span>
          </div>
          <div style="color:var(--text2);margin-top:2px">${r['Bairro'] || '—'} · ID ${r['ID Colab'] || '—'}</div>
        </div>`).join('')
        : '<div style="font-size:11px;color:var(--text3)">Nenhum serviço em atraso.</div>';

      // Abertos por categoria
      const catMap = {};
      abertos.forEach(r => {
        const c = (r['Categoria'] || '').trim();
        if (c) catMap[c] = (catMap[c] || 0) + 1;
      });
      const catEntries = Object.entries(catMap).sort((a, b) => b[1] - a[1]).slice(0, 6);
      const maxC = catEntries.length ? catEntries[0][1] : 1;
      document.getElementById('pCatList').innerHTML = catEntries.map(([lbl, n]) => `
      <div class="panel-bar-row">
        <span class="panel-bar-label" title="${lbl}">${lbl}</span>
        <div class="panel-bar-track">
          <div class="panel-bar-fill" style="width:${Math.round(n / maxC * 100)}%;background:var(--purple)"></div>
        </div>
        <span class="panel-bar-val">${n}</span>
      </div>`).join('');
    }

    function render(rows) {
      currentRows = rows;
      const range = dateRange(rows);
      if (range) {
        document.getElementById('sub-periodo').textContent =
          mesLabel(range.min) + ' – ' + mesLabel(range.max) + ' · ' + fmt(rows.length) + ' registros';
      }
      document.getElementById('last-update').textContent =
        'atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      initMap();
      plotPoints(rows);
      renderPanel(rows);
    }

    function populateMapFilters() {
      const sel = document.getElementById('fMapRegiao');
      sel.innerHTML = '<option value="">Todas</option>';
      const regioes = [...new Set(allRows.map(r => (r['Região'] || '').trim()).filter(Boolean))].sort();
      regioes.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      });
    }

    function applyMapFilter() {
      const reg = document.getElementById('fMapRegiao')?.value || '';
      const filtered = reg ? allRows.filter(r => (r['Região'] || '').trim() === reg) : allRows;
      currentRows = filtered;
      plotPoints(filtered);
      renderPanel(filtered);

      if (reg) {
        const coords = filtered
          .map(r => [
            parseFloat((r['Latitude'] || '').replace(',', '.')),
            parseFloat((r['Longitude'] || '').replace(',', '.'))
          ])
          .filter(([lat, lng]) => !isNaN(lat) && !isNaN(lng));
        if (coords.length) {
          const bounds = L.latLngBounds(coords.map(([lat, lng]) => L.latLng(lat, lng)));
          map.invalidateSize();
          setTimeout(() => {
            if (bounds.isValid()) {
              map.fitBounds(bounds, { padding: [60, 60], maxZoom: 14 });
            }
          }, 100);
        }
      } else {
        map.setView([-22.910, -43.085], 13);
      }
    }

    function onDataLoaded() {
      populateMapFilters();
      render(allRows);
    }
    function populateFilters() { }

    loadData();
  </script>
</body>

</html>
