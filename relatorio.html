<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>Relatório Mensal · DIP Seconser</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <script>try{var _t=localStorage.getItem('theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
  <link rel="stylesheet" href="css/relatorio.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
</head>

<body>

  <!-- Barra de controle -->
  <div class="control-bar">
    <a href="index.html" class="control-bar-brand" style="text-decoration:none;color:inherit">← DIP · Seconser</a>

    <div class="tab-switcher">
      <button class="tab-btn tab-active" id="tabBtnMensal" onclick="switchTab('mensal')">Relatório Mensal</button>
      <button class="tab-btn" id="tabBtnAbertos" onclick="switchTab('abertos')">Serviços em Aberto</button>
    </div>

    <div id="filtersMensal" style="display:flex;align-items:center;gap:10px">
      <label>Mês de referência</label>
      <select id="selMes">
        <option value="">Carregando…</option>
      </select>
    </div>

    <div id="filtersAbertos" style="display:none;align-items:center;gap:12px">
      <!-- Inputs hidden — armazenam valor e min/max para renderListaAbertos -->
      <input type="date" id="filtDe"  style="display:none">
      <input type="date" id="filtAte" style="display:none">

      <div class="filter-range">
        <label>De</label>
        <div class="datepicker">
          <button class="dp-trigger" onclick="openDp('de',event)">
            <span class="dp-value dp-placeholder" id="dp-de-lbl">Selecione</span>
            <span class="dp-caret">▾</span>
          </button>
          <div class="dp-dropdown" id="dp-de"></div>
        </div>
        <span class="filter-range-sep">→</span>
        <label>Até</label>
        <div class="datepicker">
          <button class="dp-trigger" onclick="openDp('ate',event)">
            <span class="dp-value dp-placeholder" id="dp-ate-lbl">Selecione</span>
            <span class="dp-caret">▾</span>
          </button>
          <div class="dp-dropdown" id="dp-ate"></div>
        </div>
      </div>
      <label>Categoria</label>
      <select id="filtCat" onchange="renderListaAbertos()"><option value="">Todas</option></select>
      <label>Região</label>
      <select id="filtReg" onchange="renderListaAbertos()"><option value="">Todas</option></select>
      <button class="btn-clear" onclick="clearFilters()">Limpar filtros</button>
    </div>

    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">◐</button>
    <button class="btn-print" onclick="window.print()">⎙ Imprimir / PDF</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <span>Carregando dados…</span>
  </div>

  <!-- Relatório -->
  <div id="relatorio"></div>

  <!-- Lista de Abertos -->
  <div id="lista-abertos"></div>

  <script src="js/relatorio.js"></script>
  <script>initTheme(); loadData();</script>
</body>

</html>
