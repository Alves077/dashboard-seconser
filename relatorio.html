<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Mensal · DIP Seconser</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

  <style>
    /* ── Variáveis — mesma paleta do dashboard ── */
    :root {
      --blue: #378ADD;
      --green: #639922;
      --amber: #BA7517;
      --red: #E24B4A;
      --purple: #7F77DD;
      --gray: #888780;
      --text: #1a1a18;
      --text2: #555550;
      --text3: #888780;
      --surface: #ffffff;
      --surface2: #f5f5f3;
      --border: rgba(0, 0, 0, 0.08);
      --border2: rgba(0, 0, 0, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface2);
      min-height: 100vh;
    }

    /* ── Tela de controle (some na impressão) ── */
    .control-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border2);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .control-bar-brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      margin-right: auto;
    }

    .control-bar label {
      font-size: 12px;
      color: var(--text2);
    }

    .control-bar select {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .btn-print {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
    }

    .btn-print:hover {
      opacity: 0.88;
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 80px;
      color: var(--text2);
      font-size: 13px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--border2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Relatório ── */
    #relatorio {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 24px 60px;
      display: none;
    }

    /* Cabeçalho do relatório */
    .rel-header {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 28px 32px 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .rel-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .rel-subtitle {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
    }

    .rel-meta {
      text-align: right;
      font-size: 11px;
      color: var(--text3);
      line-height: 1.8;
    }

    /* Seção */
    .rel-section {
      margin-bottom: 20px;
    }

    .rel-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* Card base */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px 24px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text2);
      margin-bottom: 14px;
    }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
    }

    .kpi-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text3);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 5px;
    }

    .kpi-accent {
      display: inline-block;
      width: 3px;
      height: 20px;
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Contexto mês anterior */
    .context-box {
      background: var(--surface2);
      border-left: 3px solid var(--amber);
      border-radius: 0 6px 6px 0;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--text2);
    }

    .context-box strong {
      color: var(--text);
    }

    /* Grid 2 colunas */
    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    /* Barras */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .bar-label {
      font-size: 11px;
      color: var(--text2);
      width: 160px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      background: var(--surface2);
      border-radius: 3px;
      height: 7px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .bar-val {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    .bar-pct {
      font-size: 11px;
      color: var(--text3);
      width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Tabela de regiões */
    .reg-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .reg-table th {
      text-align: right;
      font-weight: 600;
      color: var(--text3);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0 6px 8px;
      border-bottom: 1px solid var(--border);
    }

    .reg-table th:first-child {
      text-align: left;
    }

    .reg-table td {
      padding: 7px 6px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      color: var(--text2);
    }

    .reg-table td:first-child {
      text-align: left;
      color: var(--text);
      font-weight: 500;
    }

    .reg-table tr:last-child td {
      border-bottom: none;
    }


    /* Observações */
    .obs-section {
      margin-bottom: 20px;
    }

    .obs-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .obs-badge {
      font-size: 9px;
      background: var(--amber);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .obs-textarea {
      width: 100%;
      min-height: 80px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text);
      font-family: inherit;
      resize: vertical;
      background: var(--surface);
    }

    .obs-textarea:focus {
      outline: none;
      border-color: var(--blue);
    }

    .obs-print {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text2);
      white-space: pre-wrap;
      min-height: 48px;
    }

    /* ── Print ── */
    @media print {
      body {
        background: #fff;
        font-size: 11px;
      }

      .control-bar {
        display: none !important;
      }

      .obs-section .obs-label .obs-badge {
        display: none;
      }

      .obs-textarea {
        display: none !important;
      }

      .obs-print {
        display: block !important;
      }

      #relatorio {
        margin: 0;
        padding: 12px 16px 32px;
        max-width: 100%;
      }

      /* KPIs compactos */
      .kpi-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
      }

      .kpi {
        padding: 10px 8px;
      }

      .kpi-label {
        font-size: 8px;
      }

      .kpi-value {
        font-size: 18px;
      }

      .kpi-sub {
        font-size: 9px;
      }

      /* Tabelas compactas — resolve coluna cortada */
      .reg-table {
        font-size: 9px;
        width: 100%;
      }

      .reg-table th {
        padding: 3px 2px;
        white-space: nowrap;
      }

      .reg-table td {
        padding: 4px 2px;
        white-space: nowrap;
      }

      .reg-table td:first-child {
        white-space: normal;
      }

      /* Cards sem quebra interna */
      .card {
        border: 1px solid #ddd;
        break-inside: avoid;
      }

      .kpi {
        border: 1px solid #ddd;
      }

      /* Grids: permite quebrar entre páginas mas não dentro do card */
      .g2 {
        break-inside: auto;
      }

      /* Seções: não força quebra, só evita cortar no meio */
      .rel-section {
        break-inside: avoid;
      }

      /* Observações: some no print se vazia */
      .obs-section {
        break-before: auto;
      }

      .obs-vazia {
        display: none !important;
      }

      .rel-header {
        padding: 16px 20px;
      }

      .context-box {
        font-size: 11px;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Barra de controle -->
  <div class="control-bar">
    <a href="index.html" class="control-bar-brand" style="text-decoration:none;color:inherit">← DIP · Seconser</a>
    <label>Mês de referência</label>
    <select id="selMes">
      <option value="">Carregando…</option>
    </select>
    <button class="btn-print" onclick="window.print()">⎙ Imprimir / PDF</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <span>Carregando dados…</span>
  </div>

  <!-- Relatório -->
  <div id="relatorio"></div>

  <!-- Scripts do dashboard -->
  <script>
    // ── Inline de config.js e utils.js para standalone ──────────────────────
    const CSV_URL = 'https://script.google.com/macros/s/AKfycbxuYGEryQj26BBs_9ocypkJGokMaOJXk4Bq6T47rEUMi823AvKZ1SB4oztNpG7KVH6V1Q/exec?token=seconser2026dip';
    const CACHE_TTL_MS = 30 * 60 * 1000;
    const CACHE_KEY = 'dip_csv_v2';
    let allRows = [];
    let charts = {};

    function fmt(n) {
      return Number(n).toLocaleString('pt-BR');
    }
    function fmtDec(n, casas) {
      return Number(n).toLocaleString('pt-BR', {
        minimumFractionDigits: casas ?? 1,
        maximumFractionDigits: casas ?? 1,
      });
    }
    function pct(a, b) {
      if (!b) return '—';
      return fmtDec((a / b) * 100) + '%';
    }
    function parseDate(s) {
      if (!s) return null;
      const p = s.split('/');
      if (p.length === 3) return new Date(+p[2], +p[1] - 1, +p[0]);
      return new Date(s);
    }
    function mesLabel(d) {
      const m = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      return m[d.getMonth()] + '/' + String(d.getFullYear()).slice(2);
    }
    function mesKey(d) {
      return d.getFullYear() * 100 + d.getMonth();
    }

    const HEADER_MAP = {
      'ID Colab': 'ID Colab', 'Categoria': 'Categoria', 'Bairro': 'Bairro',
      'Regi\u00e3o': 'Região', 'RegiÃ£o': 'Região',
      'Data Sa\u00edda': 'Data Saída', 'Data SaÃ\xadda': 'Data Saída',
      'Data Retorno': 'Data Retorno', 'Prazo': 'Prazo',
      'Situa\u00e7\u00e3o': 'Situação', 'SituaÃ§Ã£o': 'Situação',
      'Dias Execu\u00e7\u00e3o': 'Dias Execução', 'Dias ExecuÃ§Ã£o': 'Dias Execução',
      'Faixa Execu\u00e7\u00e3o': 'Faixa Execução', 'Faixa ExecuÃ§Ã£o': 'Faixa Execução',
      'Ocorr\u00eancias': 'Ocorrências', 'OcorrÃªncias': 'Ocorrências',
      'Latitude': 'Latitude', 'Longitude': 'Longitude',
    };

    function normalizeRow(row) {
      const out = {};
      Object.keys(row).forEach(k => {
        const clean = HEADER_MAP[k.trim()] || k.trim();
        out[clean] = row[k];
      });
      const retorno = (out['Data Retorno'] || '').trim();
      if (retorno) {
        out['Situação'] = 'OK';
      } else {
        const prazo = parseDate(out['Prazo']);
        const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
        out['Situação'] = (prazo && !isNaN(prazo) && hoje > prazo) ? 'Em Atraso' : 'Em Atendimento';
      }
      return out;
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const { ts, url, csv } = JSON.parse(raw);
          if (url === CSV_URL && (Date.now() - ts) < CACHE_TTL_MS && csv) {
            processCSV(csv); return;
          }
        }
      } catch (e) { }

      Papa.parse(CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete(results) {
          const csv = Papa.unparse(results.data);
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), url: CSV_URL, csv }));
          } catch (e) { }
          allRows = results.data.map(normalizeRow);
          onDataLoaded();
        },
        error(err) {
          document.getElementById('loading').innerHTML =
            '<span style="color:var(--red)">Erro ao carregar dados: ' + err.message + '</span>';
        },
      });
    }

    function processCSV(csvText) {
      const results = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      allRows = results.data.map(normalizeRow);
      onDataLoaded();
    }

    // ── Após carregar dados ──────────────────────────────────────────────────
    function onDataLoaded() {
      document.getElementById('loading').style.display = 'none';

      // Monta lista de meses anteriores ao atual
      const hoje = new Date();
      const mesAtual = mesKey(hoje);
      const mesesMap = {};

      allRows.forEach(r => {
        const d = parseDate(r['Data Saída']);
        if (!d || isNaN(d)) return;
        const k = mesKey(d);
        if (k >= mesAtual) return; // exclui mês corrente
        if (!mesesMap[k]) mesesMap[k] = mesLabel(d);
      });

      const meses = Object.entries(mesesMap).sort((a, b) => +b[0] - +a[0]); // mais recente primeiro

      const sel = document.getElementById('selMes');
      sel.innerHTML = '<option value="">Selecione o mês…</option>';
      meses.forEach(([k, lbl]) => {
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = lbl;
        sel.appendChild(opt);
      });

      sel.addEventListener('change', () => {
        if (sel.value) renderRelatorio(+sel.value, mesesMap);
        else document.getElementById('relatorio').style.display = 'none';
      });

      // Seleciona automaticamente o mês mais recente
      if (meses.length) {
        sel.value = meses[0][0];
        renderRelatorio(+meses[0][0], mesesMap);
      }
    }

    function renderRelatorio(mesK, mesesMap) {
      // Destrói charts anteriores
      Object.values(charts).forEach(c => c.destroy());
      charts = {};
      const rel = document.getElementById('relatorio');
      rel.style.display = 'block';

      const ano = Math.floor(mesK / 100);
      const mes = mesK % 100;
      const lbl = mesesMap[mesK];

      // Filtra linhas do mês selecionado (por Data Saída)
      const rowsMes = allRows.filter(r => {
        const d = parseDate(r['Data Saída']);
        return d && !isNaN(d) && d.getFullYear() === ano && d.getMonth() === mes;
      });

      // Mês anterior para contexto de saldo
      const mesAnteriorK = mes === 0
        ? (ano - 1) * 100 + 11
        : ano * 100 + (mes - 1);
      const lblAnterior = mesesMap[mesAnteriorK] || null;

      // Saldo acumulado até o fim do mês anterior
      // = total de serviços abertos (sem Data Retorno) cujo Data Saída <= último dia do mês anterior
      const ultimoDiaMesAnterior = new Date(ano, mes, 0); // último dia do mês anterior
      ultimoDiaMesAnterior.setHours(23, 59, 59, 999);
      const saldoAnterior = allRows.filter(r => {
        const saida = parseDate(r['Data Saída']);
        if (!saida || isNaN(saida) || saida > ultimoDiaMesAnterior) return false;
        const retorno = parseDate(r['Data Retorno']);
        // aberto = sem retorno, ou retorno após o fim do mês anterior
        return !retorno || isNaN(retorno) || retorno > ultimoDiaMesAnterior;
      }).length;

      // Métricas do mês
      const total = rowsMes.length;
      const concluidos = rowsMes.filter(r => r['Situação'] === 'OK').length;
      const abertos = rowsMes.filter(r => r['Situação'] !== 'OK').length;

      // Concluídos no prazo (Dias Execução <= 5, só OK)
      const okRows = rowsMes.filter(r => r['Situação'] === 'OK');
      const diasVals = okRows.map(r =>
        parseFloat((r['Dias Execução'] || '').toString().replace(',', '.'))
      ).filter(v => !isNaN(v) && v >= 0);

      const noPrazo = diasVals.filter(v => v <= 5).length;
      const media = diasVals.length ? diasVals.reduce((a, b) => a + b, 0) / diasVals.length : 0;

      // Reaberturas
      const seen = new Map();
      rowsMes.forEach(r => {
        const id = r['ID Colab'];
        const occ = parseInt(r['Ocorrências'] || 1);
        if (!seen.has(id)) seen.set(id, occ);
      });
      let reabIds = 0, reabTotal = 0;
      seen.forEach(occ => { if (occ > 1) { reabIds++; reabTotal += occ - 1; } });

      // Distribuição por categoria com OK e Atraso
      const catMap = {};
      const catOkMap = {}, catArMap = {};
      rowsMes.forEach(r => {
        const c = (r['Categoria'] || '').trim();
        if (!c) return;
        catMap[c] = (catMap[c] || 0) + 1;
        if (r['Situação'] === 'OK') catOkMap[c] = (catOkMap[c] || 0) + 1;
        if (r['Situação'] === 'Em Atraso') catArMap[c] = (catArMap[c] || 0) + 1;
      });
      const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);

      // Distribuição por região
      const regMap = {};
      const regOkMap = {}, regArMap = {};
      rowsMes.forEach(r => {
        const reg = (r['Região'] || '').trim();
        if (!reg) return;
        regMap[reg] = (regMap[reg] || 0) + 1;
        if (r['Situação'] === 'OK') regOkMap[reg] = (regOkMap[reg] || 0) + 1;
        if (r['Situação'] === 'Em Atraso') regArMap[reg] = (regArMap[reg] || 0) + 1;
      });
      const regs = Object.entries(regMap).sort((a, b) => b[1] - a[1]);

      // Top bairros com OK e Atraso
      const bairroMap = {};
      const bairroOkMap = {}, bairroArMap = {};
      rowsMes.forEach(r => {
        const b = (r['Bairro'] || '').trim();
        if (!b) return;
        bairroMap[b] = (bairroMap[b] || 0) + 1;
        if (r['Situação'] === 'OK') bairroOkMap[b] = (bairroOkMap[b] || 0) + 1;
        if (r['Situação'] === 'Em Atraso') bairroArMap[b] = (bairroArMap[b] || 0) + 1;
      });
      const bairros = Object.entries(bairroMap).sort((a, b) => b[1] - a[1]).slice(0, 10);

      // Faixas de execução
      const faixaKeyMap = {
        '1. Até 3 dias': 'Até 3 dias',
        '2. 4 a 7 dias': '4 a 7 dias',
        '3. 8 a 15 dias': '8 a 15 dias',
        '4. Mais de 15 dias': 'Mais de 15 dias',
      };
      const faixaOrdem = ['Até 3 dias', '4 a 7 dias', '8 a 15 dias', 'Mais de 15 dias'];
      const faixaCores = ['#639922', '#378ADD', '#BA7517', '#E24B4A'];
      const faixaMap = { 'Até 3 dias': 0, '4 a 7 dias': 0, '8 a 15 dias': 0, 'Mais de 15 dias': 0 };
      okRows.forEach(r => {
        const f = faixaKeyMap[(r['Faixa Execução'] || '').trim()];
        if (f) faixaMap[f]++;
      });
      const faixaVals = faixaOrdem.map(k => faixaMap[k]);
      const totalFaixas = faixaVals.reduce((a, b) => a + b, 0);

      // ── Monta HTML ──────────────────────────────────────────────────────────
      const dataGeracao = new Date().toLocaleDateString('pt-BR', {
        day: '2-digit', month: 'long', year: 'numeric'
      });

      rel.innerHTML = `
      <!-- Cabeçalho -->
      <div class="rel-header">
        <div>
          <div class="rel-title">Relatório Mensal · ${lbl}</div>
          <div class="rel-subtitle">Departamento de Iluminação Pública · Seconser Niterói</div>
        </div>
        <div class="rel-meta">
          Gerado em ${dataGeracao}<br>
          ${fmt(total)} serviços no período<br>
          Dados: Google Sheets via Apps Script
        </div>
      </div>

      <!-- Contexto mês anterior -->
      ${lblAnterior ? `
      <div class="context-box">
        <strong>Contexto:</strong> ao início de ${lbl}, havia <strong>${fmt(saldoAnterior)} serviços em aberto</strong>
        acumulados de meses anteriores (saldo de ${lblAnterior}).
      </div>` : ''}

      <!-- KPIs -->
      <div class="rel-section">
        <div class="rel-section-title">Indicadores do mês</div>
        <div class="kpi-grid">
          <div class="kpi">
            <div class="kpi-label">Entradas</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--blue)"></span>
              <span class="kpi-value">${fmt(total)}</span>
            </div>
            <div class="kpi-sub">serviços abertos</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Concluídos</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--green)"></span>
              <span class="kpi-value">${fmt(concluidos)}</span>
            </div>
            <div class="kpi-sub">${pct(concluidos, total)} do total</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">No Prazo</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--blue)"></span>
              <span class="kpi-value">${pct(noPrazo, concluidos || 1)}</span>
            </div>
            <div class="kpi-sub">${fmt(noPrazo)} de ${fmt(concluidos)}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Tempo Médio</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--gray)"></span>
              <span class="kpi-value">${fmtDec(media)}<span style="font-size:14px;font-weight:400;color:var(--text2)"> d</span></span>
            </div>
            <div class="kpi-sub">dos concluídos</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Em Aberto</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--amber)"></span>
              <span class="kpi-value">${fmt(abertos)}</span>
            </div>
            <div class="kpi-sub">${pct(abertos, total)} do total</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Reaberturas</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--purple)"></span>
              <span class="kpi-value">${fmt(reabIds)}</span>
            </div>
            <div class="kpi-sub">${fmt(reabTotal)} evento(s)</div>
          </div>
        </div>
      </div>

      <!-- Grid 1: Categorias + Bairros -->
      <div class="rel-section">
        <div class="rel-section-title">Distribuição</div>
        <div class="g2">
          <div class="card">
            <div class="card-title">Por categoria</div>
            <table class="reg-table">
              <thead>
                <tr>
                  <th>Categoria</th>
                  <th>Total</th>
                  <th>%</th>
                  <th>Concluídos</th>
                  <th>Em Atraso</th>
                </tr>
              </thead>
              <tbody>
                ${cats.map(([cat, n]) => `
                  <tr>
                    <td>${cat}</td>
                    <td>${fmt(n)}</td>
                    <td>${pct(n, total)}</td>
                    <td style="color:var(--green)">${fmt(catOkMap[cat] || 0)}</td>
                    <td style="color:${(catArMap[cat] || 0) > 0 ? 'var(--red)' : 'var(--text3)'}">${(catArMap[cat] || 0) > 0 ? fmt(catArMap[cat]) : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="card">
            <div class="card-title">Top bairros</div>
            <table class="reg-table">
              <thead>
                <tr>
                  <th>Bairro</th>
                  <th>Total</th>
                  <th>%</th>
                  <th>Concluídos</th>
                  <th>Em Atraso</th>
                </tr>
              </thead>
              <tbody>
                ${bairros.map(([b, n]) => `
                  <tr>
                    <td>${b}</td>
                    <td>${fmt(n)}</td>
                    <td>${pct(n, total)}</td>
                    <td style="color:var(--green)">${fmt(bairroOkMap[b] || 0)}</td>
                    <td style="color:${(bairroArMap[b] || 0) > 0 ? 'var(--red)' : 'var(--text3)'}">${(bairroArMap[b] || 0) > 0 ? fmt(bairroArMap[b]) : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Grid 2: Faixas + Regiões -->
      <div class="rel-section">
        <div class="rel-section-title">Detalhamento</div>
        <div class="g2">
          <div class="card">
            <div class="card-title">Distribuição por faixa · só concluídos</div>
            <div style="position:relative;height:180px;margin-bottom:12px">
              <canvas id="cFaixas"></canvas>
            </div>
            <div id="cFaixasLegend" style="display:flex;flex-direction:column;gap:8px"></div>
          </div>
          <div class="card">
            <div class="card-title">Por região</div>
            <table class="reg-table">
              <thead>
                <tr>
                  <th>Região</th>
                  <th>Total</th>
                  <th>%</th>
                  <th>Concluídos</th>
                  <th>Em Atraso</th>
                </tr>
              </thead>
              <tbody>
                ${regs.map(([reg, n]) => `
                  <tr>
                    <td>${reg}</td>
                    <td>${fmt(n)}</td>
                    <td>${pct(n, total)}</td>
                    <td style="color:var(--green)">${fmt(regOkMap[reg] || 0)}</td>
                    <td style="color:${(regArMap[reg] || 0) > 0 ? 'var(--red)' : 'var(--text3)'}">${(regArMap[reg] || 0) > 0 ? fmt(regArMap[reg]) : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Observações -->
      <div class="rel-section obs-section">
        <div class="rel-section-title">Observações</div>
        <div class="obs-label">
          Notas do período
          <span class="obs-badge">SOME NA IMPRESSÃO SE VAZIO</span>
        </div>
        <textarea class="obs-textarea" id="obsText"
          placeholder="Ex: Fevereiro teve recesso de carnaval, impactando o volume de entradas. Março apresentou pico condicionado pelo acúmulo do mês anterior…"
          oninput="document.getElementById('obsPrint').textContent = this.value"></textarea>
        <div class="obs-print" id="obsPrint"></div>
      </div>

      <!-- Rodapé -->
    `;

      // Render donut de faixas (precisa do DOM já montado)
      renderDonutFaixas(faixaOrdem, faixaVals, faixaCores, totalFaixas);

    } // fim renderRelatorio

    // ── Donut de faixas ───────────────────────────────────────────────────────
    function renderDonutFaixas(faixaOrdem, faixaVals, faixaCores, totalFaixas) {
      const ctx = document.getElementById('cFaixas');
      if (!ctx) return;
      charts['cFaixas'] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: faixaOrdem,
          datasets: [{
            data: faixaVals,
            backgroundColor: faixaCores,
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 6,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` ${ctx.label}: ${fmt(ctx.parsed)} (${pct(ctx.parsed, totalFaixas)})`,
              },
            },
          },
        },
      });

      // Legenda externa
      const leg = document.getElementById('cFaixasLegend');
      if (leg) {
        leg.innerHTML = faixaOrdem.map((lbl, i) => `
        <div style="display:flex;align-items:center;gap:6px">
          <span style="width:9px;height:9px;border-radius:2px;background:${faixaCores[i]};flex-shrink:0"></span>
          <span style="flex:1;font-size:11px;color:var(--text2)">${lbl}</span>
          <span style="font-size:11px;color:var(--text3);margin-right:4px">${fmt(faixaVals[i])}</span>
          <span style="font-size:12px;font-weight:600;color:var(--text);width:36px;text-align:right">${pct(faixaVals[i], totalFaixas)}</span>
        </div>`).join('');
      }
    }

    // Esconde seção de observações no print se vazia
    window.addEventListener('beforeprint', () => {
      const obs = document.getElementById('obsText');
      const sec = document.querySelector('.obs-section');
      if (sec) sec.classList.toggle('obs-vazia', !obs || !obs.value.trim());
    });
    window.addEventListener('afterprint', () => {
      const sec = document.querySelector('.obs-section');
      if (sec) sec.classList.remove('obs-vazia');
    });

    // Inicia
    loadData();
  </script>
</body>

</html>
