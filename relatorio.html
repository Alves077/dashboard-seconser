<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Mensal · DIP Seconser</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    /* ── Variáveis — mesma paleta do dashboard ── */
    :root {
      --blue:   #378ADD;
      --green:  #639922;
      --amber:  #BA7517;
      --red:    #E24B4A;
      --purple: #7F77DD;
      --gray:   #888780;
      --text:   #1a1a18;
      --text2:  #555550;
      --text3:  #888780;
      --surface:  #ffffff;
      --surface2: #f5f5f3;
      --border:   rgba(0,0,0,0.08);
      --border2:  rgba(0,0,0,0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface2);
      min-height: 100vh;
    }

    /* ── Tela de controle (some na impressão) ── */
    .control-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border2);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .control-bar-brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      margin-right: auto;
    }

    .control-bar label {
      font-size: 12px;
      color: var(--text2);
    }

    .control-bar select {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .btn-print {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
    }

    .btn-print:hover { opacity: 0.88; }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 80px;
      color: var(--text2);
      font-size: 13px;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid var(--border2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Relatório ── */
    #relatorio {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 24px 60px;
      display: none;
    }

    /* Cabeçalho do relatório */
    .rel-header {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 28px 32px 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .rel-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .rel-subtitle {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
    }

    .rel-meta {
      text-align: right;
      font-size: 11px;
      color: var(--text3);
      line-height: 1.8;
    }

    /* Seção */
    .rel-section {
      margin-bottom: 20px;
    }

    .rel-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text3);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* Card base */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px 24px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text2);
      margin-bottom: 14px;
    }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
    }

    .kpi-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text3);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 5px;
    }

    .kpi-accent {
      display: inline-block;
      width: 3px;
      height: 20px;
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Contexto mês anterior */
    .context-box {
      background: var(--surface2);
      border-left: 3px solid var(--amber);
      border-radius: 0 6px 6px 0;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--text2);
    }

    .context-box strong { color: var(--text); }

    /* Grid 2 colunas */
    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    /* Barras */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .bar-label {
      font-size: 11px;
      color: var(--text2);
      width: 160px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      background: var(--surface2);
      border-radius: 3px;
      height: 7px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .bar-val {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    .bar-pct {
      font-size: 11px;
      color: var(--text3);
      width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Tabela de regiões */
    .reg-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .reg-table th {
      text-align: right;
      font-weight: 600;
      color: var(--text3);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0 6px 8px;
      border-bottom: 1px solid var(--border);
    }

    .reg-table th:first-child { text-align: left; }

    .reg-table td {
      padding: 7px 6px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      color: var(--text2);
    }

    .reg-table td:first-child { text-align: left; color: var(--text); font-weight: 500; }
    .reg-table tr:last-child td { border-bottom: none; }

    /* Chart */
    .chart-wrap {
      position: relative;
      height: 180px;
      margin-top: 4px;
    }

    /* Observações */
    .obs-section {
      margin-bottom: 20px;
    }

    .obs-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .obs-badge {
      font-size: 9px;
      background: var(--amber);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .obs-textarea {
      width: 100%;
      min-height: 80px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text);
      font-family: inherit;
      resize: vertical;
      background: var(--surface);
    }

    .obs-textarea:focus { outline: none; border-color: var(--blue); }

    .obs-print {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text2);
      white-space: pre-wrap;
      min-height: 48px;
    }

    /* Rodapé */
    .rel-footer {
      text-align: center;
      font-size: 10px;
      color: var(--text3);
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; font-size: 11px; }

      .control-bar { display: none !important; }
      .obs-section .obs-label .obs-badge { display: none; }
      .obs-textarea { display: none !important; }
      .obs-print { display: block !important; }

      #relatorio {
        margin: 0;
        padding: 20px 24px 40px;
        max-width: 100%;
      }

      .kpi-grid { grid-template-columns: repeat(6, 1fr); }

      .card, .kpi {
        border: 1px solid #ddd;
        break-inside: avoid;
      }

      .g2 { break-inside: avoid; }

      .chart-wrap { height: 160px; }

      .rel-footer { margin-top: 20px; }
    }
  </style>
</head>
<body>

<!-- Barra de controle -->
<div class="control-bar">
  <div class="control-bar-brand">DIP · Seconser — Relatório Mensal</div>
  <label>Mês de referência</label>
  <select id="selMes">
    <option value="">Carregando…</option>
  </select>
  <button class="btn-print" onclick="window.print()">⎙ Imprimir / PDF</button>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <span>Carregando dados…</span>
</div>

<!-- Relatório -->
<div id="relatorio"></div>

<!-- Scripts do dashboard -->
<script>
  // ── Inline de config.js e utils.js para standalone ──────────────────────
  const CSV_URL = 'https://script.google.com/macros/s/AKfycbxuYGEryQj26BBs_9ocypkJGokMaOJXk4Bq6T47rEUMi823AvKZ1SB4oztNpG7KVH6V1Q/exec?token=seconser2026dip';
  const CACHE_TTL_MS = 30 * 60 * 1000;
  const CACHE_KEY = 'dip_csv_v2';
  let allRows = [];
  let charts = {};

  const COLORS = {
    blue: '#378ADD', green: '#639922', amber: '#BA7517',
    red: '#E24B4A', purple: '#7F77DD', gray: '#888780',
  };

  function fmt(n) {
    return Number(n).toLocaleString('pt-BR');
  }
  function fmtDec(n, casas) {
    return Number(n).toLocaleString('pt-BR', {
      minimumFractionDigits: casas ?? 1,
      maximumFractionDigits: casas ?? 1,
    });
  }
  function pct(a, b) {
    if (!b) return '—';
    return fmtDec((a / b) * 100) + '%';
  }
  function parseDate(s) {
    if (!s) return null;
    const p = s.split('/');
    if (p.length === 3) return new Date(+p[2], +p[1] - 1, +p[0]);
    return new Date(s);
  }
  function mesLabel(d) {
    const m = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return m[d.getMonth()] + '/' + String(d.getFullYear()).slice(2);
  }
  function mesKey(d) {
    return d.getFullYear() * 100 + d.getMonth();
  }

  const HEADER_MAP = {
    'ID Colab':'ID Colab','Categoria':'Categoria','Bairro':'Bairro',
    'Regi\u00e3o':'Região','RegiÃ£o':'Região',
    'Data Sa\u00edda':'Data Saída','Data SaÃ\xadda':'Data Saída',
    'Data Retorno':'Data Retorno','Prazo':'Prazo',
    'Situa\u00e7\u00e3o':'Situação','SituaÃ§Ã£o':'Situação',
    'Dias Execu\u00e7\u00e3o':'Dias Execução','Dias ExecuÃ§Ã£o':'Dias Execução',
    'Faixa Execu\u00e7\u00e3o':'Faixa Execução','Faixa ExecuÃ§Ã£o':'Faixa Execução',
    'Ocorr\u00eancias':'Ocorrências','OcorrÃªncias':'Ocorrências',
    'Latitude':'Latitude','Longitude':'Longitude',
  };

  function normalizeRow(row) {
    const out = {};
    Object.keys(row).forEach(k => {
      const clean = HEADER_MAP[k.trim()] || k.trim();
      out[clean] = row[k];
    });
    const retorno = (out['Data Retorno'] || '').trim();
    if (retorno) {
      out['Situação'] = 'OK';
    } else {
      const prazo = parseDate(out['Prazo']);
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      out['Situação'] = (prazo && !isNaN(prazo) && hoje > prazo) ? 'Em Atraso' : 'Em Atendimento';
    }
    return out;
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        const { ts, url, csv } = JSON.parse(raw);
        if (url === CSV_URL && (Date.now() - ts) < CACHE_TTL_MS && csv) {
          processCSV(csv); return;
        }
      }
    } catch(e) {}

    Papa.parse(CSV_URL, {
      download: true, header: true, skipEmptyLines: true,
      complete(results) {
        const csv = Papa.unparse(results.data);
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), url: CSV_URL, csv }));
        } catch(e) {}
        allRows = results.data.map(normalizeRow);
        onDataLoaded();
      },
      error(err) {
        document.getElementById('loading').innerHTML =
          '<span style="color:var(--red)">Erro ao carregar dados: ' + err.message + '</span>';
      },
    });
  }

  function processCSV(csvText) {
    const results = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    allRows = results.data.map(normalizeRow);
    onDataLoaded();
  }

  // ── Após carregar dados ──────────────────────────────────────────────────
  function onDataLoaded() {
    document.getElementById('loading').style.display = 'none';

    // Monta lista de meses anteriores ao atual
    const hoje = new Date();
    const mesAtual = mesKey(hoje);
    const mesesMap = {};

    allRows.forEach(r => {
      const d = parseDate(r['Data Saída']);
      if (!d || isNaN(d)) return;
      const k = mesKey(d);
      if (k >= mesAtual) return; // exclui mês corrente
      if (!mesesMap[k]) mesesMap[k] = mesLabel(d);
    });

    const meses = Object.entries(mesesMap).sort((a, b) => +b[0] - +a[0]); // mais recente primeiro

    const sel = document.getElementById('selMes');
    sel.innerHTML = '<option value="">Selecione o mês…</option>';
    meses.forEach(([k, lbl]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = lbl;
      sel.appendChild(opt);
    });

    sel.addEventListener('change', () => {
      if (sel.value) renderRelatorio(+sel.value, mesesMap);
      else document.getElementById('relatorio').style.display = 'none';
    });

    // Seleciona automaticamente o mês mais recente
    if (meses.length) {
      sel.value = meses[0][0];
      renderRelatorio(+meses[0][0], mesesMap);
    }
  }

  // ── Render do relatório ──────────────────────────────────────────────────
  function destroyCharts() {
    Object.values(charts).forEach(c => c.destroy());
    charts = {};
  }

  function renderRelatorio(mesK, mesesMap) {
    destroyCharts();
    const rel = document.getElementById('relatorio');
    rel.style.display = 'block';

    const ano  = Math.floor(mesK / 100);
    const mes  = mesK % 100;
    const lbl  = mesesMap[mesK];

    // Filtra linhas do mês selecionado (por Data Saída)
    const rowsMes = allRows.filter(r => {
      const d = parseDate(r['Data Saída']);
      return d && !isNaN(d) && d.getFullYear() === ano && d.getMonth() === mes;
    });

    // Mês anterior para contexto de saldo
    const mesAnteriorK = mes === 0
      ? (ano - 1) * 100 + 11
      : ano * 100 + (mes - 1);
    const lblAnterior = mesesMap[mesAnteriorK] || null;

    // Saldo acumulado até o fim do mês anterior
    // = total de serviços abertos (sem Data Retorno) cujo Data Saída <= último dia do mês anterior
    const ultimoDiaMesAnterior = new Date(ano, mes, 0); // último dia do mês anterior
    ultimoDiaMesAnterior.setHours(23,59,59,999);
    const saldoAnterior = allRows.filter(r => {
      const saida = parseDate(r['Data Saída']);
      if (!saida || isNaN(saida) || saida > ultimoDiaMesAnterior) return false;
      const retorno = parseDate(r['Data Retorno']);
      // aberto = sem retorno, ou retorno após o fim do mês anterior
      return !retorno || isNaN(retorno) || retorno > ultimoDiaMesAnterior;
    }).length;

    // Métricas do mês
    const total     = rowsMes.length;
    const concluidos = rowsMes.filter(r => r['Situação'] === 'OK').length;
    const abertos   = rowsMes.filter(r => r['Situação'] !== 'OK').length;

    // Concluídos no prazo (Dias Execução <= 5, só OK)
    const okRows = rowsMes.filter(r => r['Situação'] === 'OK');
    const diasVals = okRows.map(r =>
      parseFloat((r['Dias Execução'] || '').toString().replace(',', '.'))
    ).filter(v => !isNaN(v) && v >= 0);

    const noPrazo  = diasVals.filter(v => v <= 5).length;
    const media    = diasVals.length ? diasVals.reduce((a,b) => a+b, 0) / diasVals.length : 0;

    // Reaberturas
    const seen = new Map();
    rowsMes.forEach(r => {
      const id = r['ID Colab'];
      const occ = parseInt(r['Ocorrências'] || 1);
      if (!seen.has(id)) seen.set(id, occ);
    });
    let reabIds = 0, reabTotal = 0;
    seen.forEach(occ => { if (occ > 1) { reabIds++; reabTotal += occ - 1; } });

    // Distribuição por categoria
    const catMap = {};
    rowsMes.forEach(r => {
      const c = (r['Categoria'] || '').trim();
      if (c) catMap[c] = (catMap[c] || 0) + 1;
    });
    const cats = Object.entries(catMap).sort((a,b) => b[1]-a[1]);
    const maxCat = cats.length ? cats[0][1] : 1;

    // Distribuição por região
    const regMap = {};
    const regOkMap = {}, regArMap = {};
    rowsMes.forEach(r => {
      const reg = (r['Região'] || '').trim();
      if (!reg) return;
      regMap[reg] = (regMap[reg] || 0) + 1;
      if (r['Situação'] === 'OK') regOkMap[reg] = (regOkMap[reg] || 0) + 1;
      if (r['Situação'] === 'Em Atraso') regArMap[reg] = (regArMap[reg] || 0) + 1;
    });
    const regs = Object.entries(regMap).sort((a,b) => b[1]-a[1]);

    // Tempo médio por categoria (mín 3 registros)
    const tempoSum = {}, tempoCnt = {};
    okRows.forEach(r => {
      const cat = (r['Categoria'] || '').trim();
      const v = parseFloat((r['Dias Execução'] || '').toString().replace(',','.'));
      if (!cat || isNaN(v) || v < 0) return;
      tempoSum[cat] = (tempoSum[cat] || 0) + v;
      tempoCnt[cat] = (tempoCnt[cat] || 0) + 1;
    });
    const tempoData = Object.entries(tempoSum)
      .filter(([k]) => tempoCnt[k] >= 3)
      .map(([k,v]) => [k, +(v/tempoCnt[k]).toFixed(1)])
      .sort((a,b) => b[1]-a[1])
      .slice(0, 6);

    // ── Monta HTML ──────────────────────────────────────────────────────────
    const dataGeracao = new Date().toLocaleDateString('pt-BR', {
      day: '2-digit', month: 'long', year: 'numeric'
    });

    rel.innerHTML = `
      <!-- Cabeçalho -->
      <div class="rel-header">
        <div>
          <div class="rel-title">Relatório Mensal · ${lbl}</div>
          <div class="rel-subtitle">Departamento de Iluminação Pública · Seconser Niterói</div>
        </div>
        <div class="rel-meta">
          Gerado em ${dataGeracao}<br>
          ${fmt(total)} serviços no período<br>
          Dados: Google Sheets via Apps Script
        </div>
      </div>

      <!-- Contexto mês anterior -->
      ${lblAnterior ? `
      <div class="context-box">
        <strong>Contexto:</strong> ao início de ${lbl}, havia <strong>${fmt(saldoAnterior)} serviços em aberto</strong>
        acumulados de meses anteriores (saldo de ${lblAnterior}).
      </div>` : ''}

      <!-- KPIs -->
      <div class="rel-section">
        <div class="rel-section-title">Indicadores do mês</div>
        <div class="kpi-grid">
          <div class="kpi">
            <div class="kpi-label">Entradas</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--blue)"></span>
              <span class="kpi-value">${fmt(total)}</span>
            </div>
            <div class="kpi-sub">serviços abertos</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Concluídos</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--green)"></span>
              <span class="kpi-value">${fmt(concluidos)}</span>
            </div>
            <div class="kpi-sub">${pct(concluidos, total)} do total</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">No Prazo</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--blue)"></span>
              <span class="kpi-value">${pct(noPrazo, concluidos || 1)}</span>
            </div>
            <div class="kpi-sub">${fmt(noPrazo)} de ${fmt(concluidos)}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Tempo Médio</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--gray)"></span>
              <span class="kpi-value">${fmtDec(media)}<span style="font-size:14px;font-weight:400;color:var(--text2)"> d</span></span>
            </div>
            <div class="kpi-sub">dos concluídos</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Em Aberto</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--amber)"></span>
              <span class="kpi-value">${fmt(abertos)}</span>
            </div>
            <div class="kpi-sub">${pct(abertos, total)} do total</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Reaberturas</div>
            <div style="display:flex;align-items:center">
              <span class="kpi-accent" style="background:var(--purple)"></span>
              <span class="kpi-value">${fmt(reabIds)}</span>
            </div>
            <div class="kpi-sub">${fmt(reabTotal)} evento(s)</div>
          </div>
        </div>
      </div>

      <!-- Categorias + Regiões -->
      <div class="rel-section">
        <div class="rel-section-title">Distribuição</div>
        <div class="g2">
          <div class="card">
            <div class="card-title">Por categoria</div>
            ${cats.slice(0, 8).map(([lbl, n]) => `
              <div class="bar-row">
                <span class="bar-label" title="${lbl}">${lbl}</span>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${Math.round(n/maxCat*100)}%;background:var(--purple)"></div>
                </div>
                <span class="bar-val">${fmt(n)}</span>
                <span class="bar-pct">${pct(n, total)}</span>
              </div>`).join('')}
          </div>
          <div class="card">
            <div class="card-title">Por região</div>
            <table class="reg-table">
              <thead>
                <tr>
                  <th>Região</th>
                  <th>Total</th>
                  <th>%</th>
                  <th>Concluídos</th>
                  <th>Em Atraso</th>
                </tr>
              </thead>
              <tbody>
                ${regs.map(([reg, n]) => `
                  <tr>
                    <td>${reg}</td>
                    <td>${fmt(n)}</td>
                    <td>${pct(n, total)}</td>
                    <td style="color:var(--green)">${fmt(regOkMap[reg] || 0)}</td>
                    <td style="color:${(regArMap[reg]||0) > 0 ? 'var(--red)' : 'var(--text3)'}">${(regArMap[reg]||0) > 0 ? fmt(regArMap[reg]) : '—'}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Tempo médio por categoria -->
      ${tempoData.length ? `
      <div class="rel-section">
        <div class="rel-section-title">Tempo médio de execução</div>
        <div class="card">
          <div class="card-title">Por categoria · só concluídos · mín. 3 registros</div>
          <div class="chart-wrap">
            <canvas id="cTempo"></canvas>
          </div>
        </div>
      </div>` : ''}

      <!-- Observações -->
      <div class="rel-section obs-section">
        <div class="rel-section-title">Observações</div>
        <div class="obs-label">
          Notas do período
          <span class="obs-badge">SOME NA IMPRESSÃO SE VAZIO</span>
        </div>
        <textarea class="obs-textarea" id="obsText"
          placeholder="Ex: Fevereiro teve recesso de carnaval, impactando o volume de entradas. Março apresentou pico condicionado pelo acúmulo do mês anterior…"
          oninput="document.getElementById('obsPrint').textContent = this.value"></textarea>
        <div class="obs-print" id="obsPrint"></div>
      </div>

      <!-- Rodapé -->
      <div class="rel-footer">
        Departamento de Iluminação Pública · Seconser Niterói · Relatório gerado em ${dataGeracao}
      </div>
    `;

    // ── Gráfico de tempo médio por categoria ──────────────────────────────
    if (tempoData.length) {
      const ctx = document.getElementById('cTempo');
      if (ctx) {
        charts['cTempo'] = new Chart(ctx, {
          type: 'bar',
          indexAxis: 'y',
          data: {
            labels: tempoData.map(([l]) => l),
            datasets: [{
              data: tempoData.map(([,v]) => v),
              backgroundColor: tempoData.map(([,v]) =>
                v > 10 ? COLORS.red : v > 5 ? COLORS.amber : COLORS.blue
              ),
              borderRadius: 4,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x} dias` } },
            },
            scales: {
              x: {
                beginAtZero: true,
                ticks: { color: '#6b6b66', font: { size: 10 }, callback: v => v + 'd' },
                grid: { color: 'rgba(0,0,0,0.06)' },
                border: { display: false },
              },
              y: {
                ticks: { color: '#6b6b66', font: { size: 10 } },
                grid: { display: false },
                border: { display: false },
              },
            },
          },
        });
      }
    }
  }

  // Inicia
  loadData();
</script>
</body>
</html>
