# Publica o site no GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Roda a cada push no ramo v2 (ou à mão, em Actions → Publicar site → Run workflow).
#
# ETAPA (mudar a linha abaixo e dar push — plano em docs/PUBLICACAO.md):
#   teste → site antigo na raiz (do ramo main, como hoje) + v2 em /dashboard-seconser/teste/
#   troca → v2 na raiz + site antigo em /dashboard-seconser/legado/ com aviso de que sai do ar em FIM_LEGADO
#           (o código do antigo vem da marca "site-antigo", criada antes da troca)
#   final → só a v2 (depois de desligar o Apps Script do site antigo)
name: Publicar site

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; a mais nova cancela a que estava na fila
concurrency:
  group: pages
  cancel-in-progress: true

env:
  ETAPA: troca
  FIM_LEGADO: '03/11/2026' # data em que o site antigo sai do ar (etapa troca); dá para antecipar

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Código da v2
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar a v2
        run: |
          if [ "$ETAPA" = teste ]; then BASE=/dashboard-seconser/teste/; else BASE=/dashboard-seconser/; fi
          npx tsc -b
          npx vite build --base="$BASE"

      - name: Código do site antigo
        if: env.ETAPA != 'final'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ETAPA == 'teste' && 'main' || 'site-antigo' }}
          path: antigo

      - name: Montar o site
        run: |
          mkdir -p _site
          rm -rf antigo/.git antigo/.github
          # página que só manda para o painel novo (favorito do site antigo, link do teste). $2 = a página no painel
          # ('#/mapa'…, vazio = Panorama); link do teste que já vinha com uma página ('#/prazo?…') segue para ela
          redirecionar() {
            mkdir -p "$(dirname "$1")"
            cat > "$1" <<HTML
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=/dashboard-seconser/$2"><title>Painel da DIP</title>
          <script>var h = location.hash; location.replace('/dashboard-seconser/' + (h.indexOf('#/') === 0 && h.length > 2 ? h : '$2'))</script>
          </head><body><a href="/dashboard-seconser/$2">Abrir o painel da DIP</a></body></html>
          HTML
          }
          # endereços do site antigo e do teste → o mesmo assunto no painel novo (troca e final)
          redirecionar_antigos() {
            redirecionar _site/pages/mapa.html '#/mapa'
            redirecionar _site/pages/qualidade.html '#/prazo'
            redirecionar _site/pages/tendencia.html '#/evolucao'
            redirecionar _site/relatorio.html '#/relatorios'
            redirecionar _site/teste/index.html ''
          }
          case "$ETAPA" in
            teste)
              cp -r antigo/. _site/
              mkdir -p _site/teste
              cp -r dist/. _site/teste/
              # endereço de teste fora dos buscadores
              sed -i 's#<head>#<head><meta name="robots" content="noindex" />#' _site/teste/index.html
              ;;
            troca)
              cp -r dist/. _site/
              redirecionar_antigos
              mkdir -p _site/legado
              cp -r antigo/. _site/legado/
              # aviso em todas as páginas do site antigo
              AVISO="<div style=\"position:sticky;top:0;z-index:9999;padding:10px 16px;background:#fff4d6;color:#5c4100;font:14px/1.4 system-ui,sans-serif;text-align:center;border-bottom:1px solid #f0d38a\">Esta é a versão antiga do painel e sai do ar em ${FIM_LEGADO}. <a href=\"/dashboard-seconser/\" style=\"color:#533afd;font-weight:600\">Abrir o painel novo</a></div>"
              find _site/legado -name '*.html' -print0 | xargs -0 sed -i -E "0,/<body[^>]*>/s##&${AVISO//#/\\#}#"
              # fora dos buscadores: todas as páginas do antigo (antes só as da raiz, faltava pages/)
              find _site/legado -name '*.html' -print0 | xargs -0 sed -i 's#<head>#<head><meta name="robots" content="noindex" />#'
              ;;
            final)
              cp -r dist/. _site/
              redirecionar_antigos
              ;;
            *)
              echo "ETAPA desconhecida: $ETAPA" && exit 1
              ;;
          esac
          touch _site/.nojekyll
          echo "Conteúdo publicado:" && find _site -name '*.html' -not -path '*/node_modules/*' | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
