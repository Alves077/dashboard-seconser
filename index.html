<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f6f9fc" />
    <meta name="description" content="Iluminação pública de Niterói — serviços da DIP/SECONSER: fila, prazos, mapa e relatórios." />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <title>Iluminação Pública · SECONSER Niterói</title>
    <!-- Tema antes do primeiro desenho (evita piscar claro→escuro). Padrão: CLARO, mesmo com o sistema
         no escuro (decisão do usuário, 13/10/2026); o escuro só quando a pessoa escolhe no botão.
         A cor da barra do navegador no celular (theme-color) acompanha o tema escolhido (ganchos.ts). -->
    <script>
      try {
        if (localStorage.getItem('tema') === 'escuro') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0a1324'
        } else document.documentElement.dataset.theme = 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <!-- Volta do link de e-mail do login (nova senha): o Supabase devolve os dados depois do "#", que aqui é das rotas
         (o site mostrava "Em construção"). Guarda e limpa antes do site abrir; dados/sessao.tsx usa (só nesta aba). -->
    <script>
      try {
        if (/(^#|&)(access_token|error_code|error)=/.test(location.hash)) {
          sessionStorage.setItem('retorno-auth', location.hash.slice(1))
          history.replaceState(null, '', location.pathname + location.search + '#/')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
