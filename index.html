<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1324" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Iluminação pública de Niterói — serviços da DIP/SECONSER: fila, prazos, mapa e relatórios." />
    <link rel="icon" type="image/png" href="/dashboard-seconser/img/favicon.png" />
    <title>Iluminação Pública · SECONSER Niterói</title>
    <!-- Tema antes do primeiro desenho (evita piscar claro→escuro) -->
    <script>
      try {
        var t = localStorage.getItem('tema')
        if (t !== 'claro' && t !== 'escuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
        document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
